name: Mashgin
description: 'Mashgin builds an AI-powered, computer-vision self-checkout system that
  identifies multiple items simultaneously without barcodes, letting customers check
  out in seconds. Its touchless kiosks are deployed across 5,000+ locations including
  convenience stores, stadiums, arenas, universities, and healthcare facilities, and
  integrate with 50+ payment networks, POS systems, and loyalty programs. Mashgin does
  not currently publish a public developer API, SDK, or developer portal; integrations
  are handled through direct partnerships and its support and knowledge-base channels.
  Backed by Matrix Partners, SUSA Ventures, and Y Combinator.'
